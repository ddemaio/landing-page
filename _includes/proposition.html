<div class="proposition">
    <div class="image">
        <img src="{{ '/assets/img/monochrome/' | append: include.imgName | append: '.svg' | relative_url }}" width="48" height="48" alt="{{ include.altText }}">
    </div>
    <div class="text">
        <h3>{{ include.title }}</h3>
        <div class=" description">
            {{ include.description }}
        </div>
    </div>
</div>
